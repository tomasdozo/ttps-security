spring.application.name=security
# Incluye los endpoints de Actuator expuestos en la documentación OpenAPI.
springdoc.show-actuator=true
# H2 mantiene la base de datos en memoria; los datos desaparecen al detener la aplicación.
spring.datasource.url=jdbc:h2:mem:securitydb;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
# En este ejemplo, Hibernate crea el esquema al iniciar y lo elimina al detenerse.
spring.jpa.hibernate.ddl-auto=create-drop
# Clave de ejemplo pública e insegura: en una aplicación real se debe usar una variable de entorno o un gestor de secretos.
security.jwt.secret=VG9tIGVsIGRvY2VudGUgbWFzIGNvb2wgZGUgdHRwcyE=
# Tiempo de validez del token, en milisegundos (una hora).
security.jwt.expiration-ms=3600000
